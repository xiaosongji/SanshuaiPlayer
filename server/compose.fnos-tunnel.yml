services:
  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: ownmusic-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      ownmusic:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ownmusic
